; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; For first installation, remove below line
; - upload_protocol = espota
; and replace IP adress with COM3
; - upload_port = 192.168.1.185


[env:heltec_wifi_lora_32_V3]
board = heltec_wifi_lora_32_V3

#[env:heltec_wifi_lora_32_V4]
#board = heltec_wifi_lora_32_V4

[env:heltec_wifi_lora_32_V4_3]
platform = espressif32@8.0.0
board = heltec_wifi_lora_32_V4
board_upload.flash_size = 16MB
board_build.partitions = app3M_fat9M_16MB.csv
build_unflags = -DUSE_NONE_PA
build_flags = -DUSE_KCT8103L_PA -DARDUINO_USB_CDC_ON_BOOT=1 -DOFV_HELTEC_V43_LOW_POWER_PROFILE=1
upload_protocol = esptool
upload_port =
upload_flags =

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
#upload_port = /dev/cu.usbserial-0001
#monitor_port = /dev/cu.usbserial-0001
upload_protocol = espota
upload_port = 192.168.1.184
upload_flags = "--host_port=3232 --timeout=30"

lib_deps = 
	jgromes/RadioLib@7.8.1
	knolleary/PubSubClient@2.8
	; Heltec 2.x nécessite une migration de la configuration carte/LoRaWAN.
	heltecautomation/Heltec ESP32 Dev-Boards@1.1.2
	paulstoffregen/OneWire@2.3.8
	milesburton/DallasTemperature@4.0.6
	paulstoffregen/Time@1.6.1
	bblanchon/ArduinoJson@7.4.3

extra_scripts =
	pre:tools/generate_web_assets.py
	pre:tools/version.py
